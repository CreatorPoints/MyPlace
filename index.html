<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySpace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>MySpace</h1>
    <p>Manage your custom spaces</p>
  </header>

  <main>
    <section class="spaces-grid">
      <div class="space-card">
        <h2>Personal</h2>
        <p>Manage personal links and notes.</p>
        <button class="manage-btn">Manage</button>
      </div>

      <div class="space-card">
        <h2>Work</h2>
        <p>Manage work-related projects and tasks.</p>
        <button class="manage-btn">Manage</button>
      </div>

      <div class="space-card">
        <h2>Projects</h2>
        <p>Manage active builds and repositories.</p>
        <button class="manage-btn">Manage</button>
      </div>
    </section>
  </main>
</body>
</html>
